name: Publish Black Pearl V6.6

on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-v6-6.yml"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download V6.6 full APK build
        env:
          SOURCE_ZIP_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-be94-8210-9310-639168a05849/raw?se=2026-10-01T14%3A10%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=5ce2eec6-5ec4-5f52-8e5c-c3b7da8058cd&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T09%3A59%3A38Z&ske=2026-10-02T09%3A59%3A38Z&sks=b&skv=2026-02-06&sig=S2I65PIYpquE3u2/iTeFMUProYEqs9L4/32lkgeUxu0%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$SOURCE_ZIP_URL" --output /tmp/v66.zip
          rm -rf /tmp/v66
          mkdir -p /tmp/v66
          unzip -q /tmp/v66.zip -d /tmp/v66
          find /tmp/v66 -type f -maxdepth 5 -print

      - name: Replace stable public APK
        run: |
          set -euo pipefail
          APK="$(find /tmp/v66 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" BlackPearl-TV.apk
          sha256sum BlackPearl-TV.apk > BlackPearl-TV.sha256
          cat > VERSION.txt <<'EOF'
          Black Pearl TV V6.6 - Seamless Split 4K Design
          Package: de.heimkinonerds.blackpearl.debug
          Version name: 6.0.6-ornate-split4k
          Version code: 60006
          Source branch: design/ornate-v6
          Source commit: 3e590d85fc2dea45d73f49343169df7b3af62f5e
          GitHub Actions run: 36873000628
          Design:
          - one single master artwork upscaled to 3840x2160
          - exact 30/70 vertical split at 1152px
          - left sidebar asset: 1152x2160
          - right content wallpaper: 2688x2160
          - both assets originate from the identical master image
          - separate black_pearl_skull overlay removed
          - text-free pirate artwork below navigation/content
          - ornate cover overlays and focused glow retained
          - Quick Connect authenticated-home fix retained
          EOF

      - name: Commit V6.6 stable APK
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BlackPearl-TV.apk BlackPearl-TV.sha256 VERSION.txt
          git commit -m "Publish Black Pearl TV V6.6 seamless split 4K design"
          git push
