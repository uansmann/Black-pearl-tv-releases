name: Publish Black Pearl V4 config-aware

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v4-config-aware.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download V4 build
        env:
          SOURCE_ZIP_URL: "https://sdmntprukwest.oaiusercontent.com/files/00000000-70d4-8243-81d6-0b800c637329/raw?se=2026-09-30T11%3A20%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=f525297b-3087-551c-81d4-c656e397a7cb&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T11%3A10%3A44Z&ske=2026-10-01T11%3A10%3A44Z&sks=b&skv=2026-02-06&sig=tBSZLRRZy932s8teXCPCQLfDyevsuzuHCiUrEMqjrA4%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$SOURCE_ZIP_URL" --output /tmp/black-pearl-v4.zip
          rm -rf /tmp/black-pearl-v4
          mkdir -p /tmp/black-pearl-v4
          unzip -q /tmp/black-pearl-v4.zip -d /tmp/black-pearl-v4
          find /tmp/black-pearl-v4 -maxdepth 2 -type f -print

      - name: Replace stable public APK
        run: |
          set -euo pipefail
          APK="$(find /tmp/black-pearl-v4 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" BlackPearl-TV.apk
          sha256sum BlackPearl-TV.apk > BlackPearl-TV.sha256
          cat > VERSION.txt <<'EOF'
          Black Pearl TV V4 - config aware
          Package: de.heimkinonerds.blackpearl.debug
          Source build commit: e308e7dbf8a69f3e5b7d8c38ace3a82b7f82e4e4
          Changes:
          - fixed Black Pearl hero: selected films no longer replace any part of the hero
          - sidebar libraries are generated dynamically from Jellyfin user views/configuration
          - Movies / Series / Music / 3D / Collections / custom libraries appear only when configured
          - Continue Watching appears only when enabled in Jellyfin home settings and content exists
          - Home rows appear only when configured and non-empty
          - lower-left sidebar now includes static skull artwork plus slogan
          - Settings remains always available
          - 3D playback deferred
          EOF

      - name: Commit V4 APK
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BlackPearl-TV.apk BlackPearl-TV.sha256 VERSION.txt
          git commit -m "Publish Black Pearl TV V4 config-aware"
          git push
