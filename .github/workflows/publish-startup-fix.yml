name: Publish Shield startup fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-startup-fix.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download fixed build
        env:
          SOURCE_ZIP_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-d138-8210-b04f-0fcf16006139/raw?se=2026-09-29T22%3A29%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=1fe0d25a-872d-5b07-a0d0-f154078c918c&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T04%3A10%3A42Z&ske=2026-09-30T04%3A10%3A42Z&sks=b&skv=2026-02-06&sig=FDIz9UtTVa%2Bwlfn0ImU8twPwiO2rFK%2B0fpPxjau5hFg%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$SOURCE_ZIP_URL" --output /tmp/black-pearl-fix.zip
          rm -rf /tmp/black-pearl-fix
          mkdir -p /tmp/black-pearl-fix
          unzip -q /tmp/black-pearl-fix.zip -d /tmp/black-pearl-fix
          find /tmp/black-pearl-fix -maxdepth 2 -type f -print

      - name: Replace public APK
        run: |
          set -euo pipefail
          APK="$(find /tmp/black-pearl-fix -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" BlackPearl-TV.apk
          sha256sum BlackPearl-TV.apk > BlackPearl-TV.sha256
          cat > VERSION.txt <<'EOF'
          Black Pearl TV V1 - Shield startup fix
          Package: de.heimkinonerds.blackpearl.debug
          Source build commit: 0eca411b55d61f7906c918d2bba135a5200cccf1
          Fix: startup background no longer rasterizes an intrinsic-size-less shape drawable
          3D playback: deferred
          EOF

      - name: Commit fixed APK
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BlackPearl-TV.apk BlackPearl-TV.sha256 VERSION.txt
          git commit -m "Publish Shield startup fix"
          git push
