name: Publish Black Pearl V6 Safe Home

on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-v6-safehome.yml"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download V6 safe-home build
        env:
          SOURCE_ZIP_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-9c24-8210-847c-8b60cf4e5da4/raw?se=2026-10-01T05%3A50%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=a84742f2-2098-527b-8788-8320ef50d2d2&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T05%3A05%3A23Z&ske=2026-10-02T05%3A05%3A23Z&sks=b&skv=2026-02-06&sig=V1RkuhzpkT56fw7KcbJCuE4l94uNa/3Dp/A/1uyrcYM%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$SOURCE_ZIP_URL" --output /tmp/black-pearl-v6.zip
          rm -rf /tmp/black-pearl-v6
          mkdir -p /tmp/black-pearl-v6
          unzip -q /tmp/black-pearl-v6.zip -d /tmp/black-pearl-v6
          find /tmp/black-pearl-v6 -type f -maxdepth 5 -print

      - name: Replace stable public APK
        run: |
          set -euo pipefail
          APK="$(find /tmp/black-pearl-v6 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" BlackPearl-TV.apk
          sha256sum BlackPearl-TV.apk > BlackPearl-TV.sha256
          cat > VERSION.txt <<'EOF'
          Black Pearl TV V6.1 - Safe Home Fix
          Source branch: design/ornate-v6
          Source build commit: 407bd297a1a45a2e099833be6a3164bdc319d817
          GitHub Actions run: 36797493811
          Purpose:
          - V6.1 safe-home fixes after Quick Connect login
          - supersedes commits 703532200ed4c83142bd43db539bf185982957b3 and c100235cd239c3efd02e5c293144e9b7fc040575
          EOF

      - name: Commit V6.1 APK
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BlackPearl-TV.apk BlackPearl-TV.sha256 VERSION.txt
          git commit -m "Publish Black Pearl TV V6.1 safe-home fix"
          git push
