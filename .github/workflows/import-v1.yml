name: Import Black Pearl TV V1 APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-v1.yml"

permissions:
  contents: write

jobs:
  import-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v5

      - name: Download V1 build artifact
        env:
          SOURCE_ZIP_URL: "https://sdmntprukwest.oaiusercontent.com/files/00000000-cc1c-8243-b03d-339f5ee61acd/raw?se=2026-09-29T21%3A16%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=ff783834-0dc8-5d4c-b47c-3542fc36f9e5&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T15%3A15%3A19Z&ske=2026-09-30T15%3A15%3A19Z&sks=b&skv=2026-02-06&sig=r3TDkPWPfIHdTRvgOclkn8KUbUq9MS8dNpI%2BHb/lJUY%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$SOURCE_ZIP_URL" --output /tmp/black-pearl-v1.zip
          mkdir -p /tmp/black-pearl-v1
          unzip -q /tmp/black-pearl-v1.zip -d /tmp/black-pearl-v1
          find /tmp/black-pearl-v1 -maxdepth 2 -type f -print

      - name: Publish stable APK path
        run: |
          set -euo pipefail
          APK="$(find /tmp/black-pearl-v1 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" BlackPearl-TV.apk
          sha256sum BlackPearl-TV.apk > BlackPearl-TV.sha256
          cat > VERSION.txt <<'EOF'
          Black Pearl TV V1
          Package: de.heimkinonerds.blackpearl.debug
          Source build commit: 73d049a2b87325c8349e0624760ba1c63aaffb51
          3D playback: deferred
          EOF
          ls -lh BlackPearl-TV.apk
          cat BlackPearl-TV.sha256

      - name: Commit public APK
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BlackPearl-TV.apk BlackPearl-TV.sha256 VERSION.txt
          git commit -m "Publish Black Pearl TV V1 APK"
          git push
