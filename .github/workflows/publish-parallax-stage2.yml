name: Publish Black Pearl Stage2 Parallax

on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-parallax-stage2.yml"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download Stage2 build
        env:
          SOURCE_ZIP_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-27d4-8210-8417-aef590f7dad6/raw?se=2026-10-02T07%3A59%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=f9d4b72a-4efa-56c3-8f41-682c1a97eab3&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T04%3A55%3A59Z&ske=2026-10-03T04%3A55%3A59Z&sks=b&skv=2026-02-06&sig=EIHAoRyZJUsLqnV5afpF0m/qPUpXl9NLmeNIXfKEg/4%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$SOURCE_ZIP_URL" --output /tmp/parallax.zip
          rm -rf /tmp/parallax && mkdir -p /tmp/parallax
          unzip -q /tmp/parallax.zip -d /tmp/parallax
          APK="$(find /tmp/parallax -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" BlackPearl-TV-Parallax.apk
          sha256sum BlackPearl-TV-Parallax.apk > BlackPearl-TV-Parallax.sha256
          cat > PARALLAX-VERSION.txt <<'EOF'
          Black Pearl TV Stage 2 2.5D Parallax Test
          Version name: 6.1.0-parallax-stage2
          Version code: 60100
          Source branch: experiment/2.5d-parallax
          Source commit: 596ad12732a66af914b36dfe92aa8230238e23c6
          GitHub Actions run: 36980191543
          Final APK Design only branch remains unchanged.
          Layers:
          - base sky/map background with reveal-area inpainting
          - environment / sea / distant rocks
          - Black Pearl ship
          - upper treasure + skull foreground
          - lower skull / crossbones foreground
          Behaviour:
          - focus-driven horizontal and vertical parallax
          - progressively stronger movement by depth
          - 1.3 second layered launch settle
          - focused covers retain ornate scale/glow treatment
          EOF
      - name: Publish test APK
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BlackPearl-TV-Parallax.apk BlackPearl-TV-Parallax.sha256 PARALLAX-VERSION.txt
          git commit -m "Publish Stage 2 2.5D parallax test APK"
          git push
