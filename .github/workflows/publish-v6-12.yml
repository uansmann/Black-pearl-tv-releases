name: Publish Black Pearl V6.12

on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-v6-12.yml"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download V6.12 full APK build
        env:
          SOURCE_ZIP_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-40e8-8210-a901-04d756a50708/raw?se=2026-10-01T16%3A54%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=e8a74c7b-ca43-5c5e-ae83-b40d95e04eef&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T09%3A28%3A43Z&ske=2026-10-02T09%3A28%3A43Z&sks=b&skv=2026-02-06&sig=Tceq9WRZAjkMzeCUBM0tbzGEbu%2BwvEcH%2BPoNa7DAmkA%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$SOURCE_ZIP_URL" --output /tmp/v612.zip
          rm -rf /tmp/v612
          mkdir -p /tmp/v612
          unzip -q /tmp/v612.zip -d /tmp/v612
          find /tmp/v612 -type f -maxdepth 5 -print

      - name: Replace stable public APK
        run: |
          set -euo pipefail
          APK="$(find /tmp/v612 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" BlackPearl-TV.apk
          sha256sum BlackPearl-TV.apk > BlackPearl-TV.sha256
          cat > VERSION.txt <<'EOF'
          Black Pearl TV V6.12 - Approved Black Pearl Cinema Logo
          Package: de.heimkinonerds.blackpearl.debug
          Version name: 6.0.12-approved-logo
          Version code: 60012
          Source branch: design/ornate-v6
          Source commit: d0ea7ae7ddc83bb4ffb91e09652c054c04414318
          GitHub Actions run: 36894403577
          Changes:
          - approved BLACK PEARL / CINEMA artwork baked directly into the 4K master wallpaper
          - no runtime Compose header text
          - no slogan under the logo
          - keeps 30/70 seamless split theme
          - keeps configurable Jellyfin home sections
          - keeps ornate cover overlays and Quick Connect auth gate
          EOF

      - name: Commit V6.12 stable APK
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BlackPearl-TV.apk BlackPearl-TV.sha256 VERSION.txt
          git commit -m "Publish Black Pearl TV V6.12 approved logo"
          git push
