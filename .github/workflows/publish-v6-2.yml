name: Publish Black Pearl V6.2

on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-v6-2.yml"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download V6.2 build
        env:
          SOURCE_ZIP_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-a794-81f4-8e11-61727b6137fb/raw?se=2026-10-01T06%3A02%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=88abcd73-ab29-5167-a859-92698c19d026&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T04%3A51%3A09Z&ske=2026-10-02T04%3A51%3A09Z&sks=b&skv=2026-02-06&sig=ety4psgrB6tAHEeN084wqY5pjjuGP6DIdvZcZt0TJ1M%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$SOURCE_ZIP_URL" --output /tmp/v62.zip
          rm -rf /tmp/v62 && mkdir -p /tmp/v62
          unzip -q /tmp/v62.zip -d /tmp/v62
          find /tmp/v62 -type f -maxdepth 5 -print
      - name: Replace stable public APK
        run: |
          set -euo pipefail
          APK="$(find /tmp/v62 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" BlackPearl-TV.apk
          sha256sum BlackPearl-TV.apk > BlackPearl-TV.sha256
          cat > VERSION.txt <<'EOF'
          Black Pearl TV V6.2 - Authenticated Home Gate
          Source branch: design/ornate-v6
          Source build commit: 67438f2594e986dc0380e37e2e6d75fb938c8079
          GitHub Actions run: 36821743269
          Fix:
          - waits for a non-null authenticated Jellyfin currentUser before initializing the custom home
          - matches the upstream Jellyfin HomeRowsFragment login/session readiness behavior
          EOF
      - name: Commit V6.2 APK
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BlackPearl-TV.apk BlackPearl-TV.sha256 VERSION.txt
          git commit -m "Publish Black Pearl TV V6.2 authenticated-home fix"
          git push
