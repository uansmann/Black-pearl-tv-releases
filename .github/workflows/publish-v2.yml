name: Publish Black Pearl V2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v2.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download V2 build
        env:
          SOURCE_ZIP_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-343c-81f4-853b-1a5608ba9d83/raw?se=2026-09-30T09%3A18%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=0180ee36-b494-5ab0-8478-e5dcd0c3017d&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T06%3A07%3A51Z&ske=2026-10-01T06%3A07%3A51Z&sks=b&skv=2026-02-06&sig=jHsv1ZAhHlg1HlU2QMZHYPndH2fnShZYnzNx/95oYV8%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$SOURCE_ZIP_URL" --output /tmp/black-pearl-v2.zip
          rm -rf /tmp/black-pearl-v2
          mkdir -p /tmp/black-pearl-v2
          unzip -q /tmp/black-pearl-v2.zip -d /tmp/black-pearl-v2
          find /tmp/black-pearl-v2 -maxdepth 2 -type f -print

      - name: Replace stable public APK
        run: |
          set -euo pipefail
          APK="$(find /tmp/black-pearl-v2 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" BlackPearl-TV.apk
          sha256sum BlackPearl-TV.apk > BlackPearl-TV.sha256
          cat > VERSION.txt <<'EOF'
          Black Pearl TV V2
          Package: de.heimkinonerds.blackpearl.debug
          Source build commit: 86cc61457df1cb1baa3b36a35b261fe752c2d1bd
          Changes:
          - removed Powered by Jellyfin from home screen
          - narrower sidebar and larger Black Pearl logo
          - larger Continue Watching posters
          - improved row spacing and section hierarchy
          - stronger antique-gold focus frame
          - refined hero proportions and typography
          - more visible footer skull / ornament
          - 3D playback deferred
          EOF

      - name: Commit V2 APK
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BlackPearl-TV.apk BlackPearl-TV.sha256 VERSION.txt
          git commit -m "Publish Black Pearl TV V2"
          git push
