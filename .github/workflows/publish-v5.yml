name: Publish Black Pearl V5

on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-v5.yml"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download V5 build
        env:
          SOURCE_ZIP_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-53a0-81f4-8751-974ae8cb10d4/raw?se=2026-09-30T16%3A31%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=417d2a7d-19cc-5f4b-ae3f-94e06838026f&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T10%3A34%3A54Z&ske=2026-10-01T10%3A34%3A54Z&sks=b&skv=2026-02-06&sig=lp7aXwIjCO/XuynB7Su5rI96/X/zRwgz6b1giT9qf3c%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$SOURCE_ZIP_URL" --output /tmp/black-pearl-v5.zip
          rm -rf /tmp/black-pearl-v5
          mkdir -p /tmp/black-pearl-v5
          unzip -q /tmp/black-pearl-v5.zip -d /tmp/black-pearl-v5
          find /tmp/black-pearl-v5 -maxdepth 2 -type f -print

      - name: Replace stable public APK
        run: |
          set -euo pipefail
          APK="$(find /tmp/black-pearl-v5 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" BlackPearl-TV.apk
          sha256sum BlackPearl-TV.apk > BlackPearl-TV.sha256
          cat > VERSION.txt <<'EOF'
          Black Pearl TV V5 - Pirate Wallpaper Theme
          Package: de.heimkinonerds.blackpearl.debug
          Source build commit: 52c042619264ccd30c010eeafdc1d4283df46894
          Changes:
          - full right-side Black Pearl wallpaper instead of black empty area
          - themed pirate poster frames for all covers
          - stronger golden focus frame
          - enlarged lower-left sidebar decoration
          - dynamic sidebar based on Jellyfin user libraries/config
          - Continue Watching and Recently Added only when configured and populated
          - 3D playback deferred
          EOF

      - name: Commit V5 APK
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BlackPearl-TV.apk BlackPearl-TV.sha256 VERSION.txt
          git commit -m "Publish Black Pearl TV V5"
          git push
