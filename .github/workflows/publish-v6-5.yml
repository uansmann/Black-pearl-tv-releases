name: Publish Black Pearl V6.5

on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-v6-5.yml"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download V6.5 full APK build
        env:
          SOURCE_ZIP_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-e210-8210-b492-96f17641f767/raw?se=2026-10-01T12%3A17%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=9070fc22-2060-5ea7-b7d8-c3918702a33a&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T07%3A22%3A30Z&ske=2026-10-02T07%3A22%3A30Z&sks=b&skv=2026-02-06&sig=srd3cvJ9dqeVVx2HaSD%2BVpRTPppAw6ekzORQUKqplE8%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$SOURCE_ZIP_URL" --output /tmp/v65.zip
          rm -rf /tmp/v65
          mkdir -p /tmp/v65
          unzip -q /tmp/v65.zip -d /tmp/v65
          find /tmp/v65 -type f -maxdepth 5 -print

      - name: Replace stable public APK
        run: |
          set -euo pipefail
          APK="$(find /tmp/v65 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" BlackPearl-TV.apk
          sha256sum BlackPearl-TV.apk > BlackPearl-TV.sha256
          cat > VERSION.txt <<'EOF'
          Black Pearl TV V6.5 - Unified 4K Wallpaper
          Package: de.heimkinonerds.blackpearl.debug
          Version name: 6.0.5-ornate-4k
          Version code: 60005
          Source branch: design/ornate-v6
          Source commit: 2fcd999ee5da7d1313cd0fac9be4a05dfe0145d9
          GitHub Actions run: 36857271226
          Changes:
          - unified 4K 3840x2160 wallpaper across header and content
          - seamless gradient transition instead of visible two-part split
          - removes duplicate branding/slogan text from sidebar
          - brighter and larger lower-left skull decoration
          - keeps ornate cover overlays and focused glow
          - keeps Quick Connect authenticated-home fix
          - keeps dynamic Jellyfin covers and library configuration
          EOF

      - name: Commit V6.5 stable APK
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BlackPearl-TV.apk BlackPearl-TV.sha256 VERSION.txt
          git commit -m "Publish Black Pearl TV V6.5 unified 4K UI"
          git push
