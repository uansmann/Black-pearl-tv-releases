name: Publish final Black Pearl theme

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-final-theme.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download final theme build
        env:
          SOURCE_ZIP_URL: "https://sdmntprukwest.oaiusercontent.com/files/00000000-edd0-8243-ba61-89a18790b6ff/raw?se=2026-09-30T07%3A29%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=33e2b9f9-039b-5ed0-835f-94890c02a223&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T06%3A32%3A10Z&ske=2026-10-01T06%3A32%3A10Z&sks=b&skv=2026-02-06&sig=lo7Y2jy7ihrvr4Kn6BHCVVAiMaOlqEiDOkSdaIIHvO4%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$SOURCE_ZIP_URL" --output /tmp/black-pearl-final.zip
          rm -rf /tmp/black-pearl-final
          mkdir -p /tmp/black-pearl-final
          unzip -q /tmp/black-pearl-final.zip -d /tmp/black-pearl-final
          find /tmp/black-pearl-final -maxdepth 2 -type f -print

      - name: Replace public APK
        run: |
          set -euo pipefail
          APK="$(find /tmp/black-pearl-final -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" BlackPearl-TV.apk
          sha256sum BlackPearl-TV.apk > BlackPearl-TV.sha256
          cat > VERSION.txt <<'EOF'
          Black Pearl TV - Final Theme Build
          Package: de.heimkinonerds.blackpearl.debug
          Source build commit: c08f447c531226f53b9e57188cd0621e053b47e2
          Theme: Black Pearl final home design based on target mockup
          Sidebar: Home / Movies / Collections / Continue Watching / Demo Scenes / Settings
          Hero: dynamic Jellyfin backdrop, metadata and media badges
          Player OSD: Black Pearl themed
          3D playback: deferred
          EOF

      - name: Commit final theme APK
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BlackPearl-TV.apk BlackPearl-TV.sha256 VERSION.txt
          git commit -m "Publish final Black Pearl theme APK"
          git push
