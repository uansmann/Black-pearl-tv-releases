name: Publish Black Pearl V6.4

on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-v6-4.yml"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download V6.4 full APK build
        env:
          SOURCE_ZIP_URL: "https://sdmntprukwest.oaiusercontent.com/files/00000000-5980-8243-a04b-d92578b6f0d5/raw?se=2026-10-01T08%3A43%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=789525d0-ae8a-512c-bec4-34e84a753134&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T04%3A21%3A16Z&ske=2026-10-02T04%3A21%3A16Z&sks=b&skv=2026-02-06&sig=aEAIAORsItc/jWog61ow%2BYE1jNA7sV9/y6HRu4VSWY4%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$SOURCE_ZIP_URL" --output /tmp/v64.zip
          rm -rf /tmp/v64
          mkdir -p /tmp/v64
          unzip -q /tmp/v64.zip -d /tmp/v64
          find /tmp/v64 -type f -maxdepth 5 -print

      - name: Replace stable public APK
        run: |
          set -euo pipefail
          APK="$(find /tmp/v64 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" BlackPearl-TV.apk
          sha256sum BlackPearl-TV.apk > BlackPearl-TV.sha256
          cat > VERSION.txt <<'EOF'
          Black Pearl TV V6.4 - Full Wallpaper + Ornate Cover Overlays
          Package: de.heimkinonerds.blackpearl.debug
          Version name: 6.0.4-ornate-wallpaper
          Version code: 60004
          Source branch: design/ornate-v6
          Source commit: 2993dd2fc66e299c965cef0a9ca0fae89b17cebf
          GitHub Actions run: 36837085397
          Fixes:
          - keeps authenticated currentUser gate after Quick Connect
          - restores the complete 1920x1080 Black Pearl wallpaper asset
          - renders wallpaper full-area behind header and content rows
          - content overlay is translucent so wallpaper remains visible
          - replaces simplified cover borders with real transparent ornate pirate overlays
          - separate antique-gold normal frame and bright-glow focused frame
          - keeps dynamic Jellyfin covers and library configuration
          EOF

      - name: Commit V6.4 stable APK
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BlackPearl-TV.apk BlackPearl-TV.sha256 VERSION.txt
          git commit -m "Publish Black Pearl TV V6.4 wallpaper and ornate overlays"
          git push
