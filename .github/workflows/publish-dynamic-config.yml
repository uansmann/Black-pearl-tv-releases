name: Publish dynamic-config Black Pearl APK

on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-dynamic-config.yml"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download latest Black Pearl build
        env:
          SOURCE_ZIP_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-4698-81f4-b3ac-2e4e01e56591/raw?se=2026-09-30T11%3A23%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=03fb862e-5cc5-506a-8da5-cffeaf08fcf5&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T06%3A32%3A59Z&ske=2026-10-01T06%3A32%3A59Z&sks=b&skv=2026-02-06&sig=y9JriGDNXhIz%2BE2AwQVU6n2RFmhiGP89E34HfARq378%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$SOURCE_ZIP_URL" --output /tmp/black-pearl.zip
          rm -rf /tmp/black-pearl
          mkdir -p /tmp/black-pearl
          unzip -q /tmp/black-pearl.zip -d /tmp/black-pearl
          find /tmp/black-pearl -maxdepth 2 -type f -print

      - name: Replace stable public APK
        run: |
          set -euo pipefail
          APK="$(find /tmp/black-pearl -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" BlackPearl-TV.apk
          sha256sum BlackPearl-TV.apk > BlackPearl-TV.sha256
          cat > VERSION.txt <<'EOF'
          Black Pearl TV - Dynamic Config Build
          Package: de.heimkinonerds.blackpearl.debug
          Source build commit: e308e7dbf8a69f3e5b7d8c38ace3a82b7f82e4e4
          Changes:
          - sidebar follows actual Jellyfin user libraries/views
          - Continue Watching only appears when configured and populated
          - Recently Added only appears when configured and populated
          - fixed Black Pearl home hero retained
          - only configured/used content is shown
          - 3D playback deferred
          EOF

      - name: Commit APK
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BlackPearl-TV.apk BlackPearl-TV.sha256 VERSION.txt
          git commit -m "Publish dynamic-config Black Pearl APK"
          git push
