name: Publish Black Pearl fixed hero

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-fixed-hero.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download fixed hero build
        env:
          SOURCE_ZIP_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-a914-81f4-b29f-bede91000668/raw?se=2026-09-30T10%3A37%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=3e015544-6083-5af0-94e3-38f619847acf&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T05%3A51%3A51Z&ske=2026-10-01T05%3A51%3A51Z&sks=b&skv=2026-02-06&sig=Y2VnilbC4uFzz8oDSu9Qgn451XZMaXjDH0i1zTb1Ik4%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$SOURCE_ZIP_URL" --output /tmp/black-pearl-fixed-hero.zip
          rm -rf /tmp/black-pearl-fixed-hero
          mkdir -p /tmp/black-pearl-fixed-hero
          unzip -q /tmp/black-pearl-fixed-hero.zip -d /tmp/black-pearl-fixed-hero
          find /tmp/black-pearl-fixed-hero -maxdepth 2 -type f -print

      - name: Replace stable public APK
        run: |
          set -euo pipefail
          APK="$(find /tmp/black-pearl-fixed-hero -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" BlackPearl-TV.apk
          sha256sum BlackPearl-TV.apk > BlackPearl-TV.sha256
          cat > VERSION.txt <<'EOF'
          Black Pearl TV - Fixed Hero Theme
          Package: de.heimkinonerds.blackpearl.debug
          Source build commit: cc3c46ae01b280a8d1614500a5ede985324fe418
          Changes:
          - fixed Black Pearl branded hero on Home
          - hero no longer changes with selected movie
          - fixed sidebar, fixed content slots and Black Pearl ornamentation retained
          - Powered by Jellyfin remains removed from Home
          - 3D playback deferred
          EOF

      - name: Commit fixed hero APK
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BlackPearl-TV.apk BlackPearl-TV.sha256 VERSION.txt
          git commit -m "Publish Black Pearl fixed hero theme"
          git push
